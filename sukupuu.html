<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body { font-family: 'Segoe UI', Arial, sans-serif; background: #1a1a2e; color: #eee; }
#header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: #16213e; padding: 8px 12px;
  display: flex; align-items: center; gap: 8px;
  border-bottom: 1px solid #0f3460; box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  flex-wrap: nowrap;
}
#header h1 { font-size: 1rem; color: #e94560; white-space: nowrap; flex-shrink: 0; }
#search {
  flex: 1; min-width: 0; padding: 8px 14px; border-radius: 20px;
  border: 1px solid #0f3460; background: #0f3460; color: #eee;
  font-size: 1rem; outline: none;
}
#search:focus { border-color: #e94560; }
.badge { background: #0f3460; border-radius: 12px; padding: 4px 10px; font-size: 0.75rem; color: #aaa; white-space: nowrap; flex-shrink: 0; }
#btn-reset { padding: 7px 12px; border-radius: 12px; border: 1px solid #e94560; flex-shrink: 0;
  background: transparent; color: #e94560; cursor: pointer; font-size: 0.85rem; white-space: nowrap; }
#btn-reset:hover { background: #e94560; color: #fff; }
#container { width: 100%; height: 100vh; padding-top: 50px; }
svg { width: 100%; height: 100%; }
.link { fill: none; stroke: #0f3460; stroke-width: 1.5px; }
.link.leaf-link { stroke: #333; stroke-dasharray: 4,3; }
.node circle { stroke-width: 2px; cursor: pointer; }
.node.has-children circle { fill: #0f3460; stroke: #4a9fd4; }
.node.leaf circle { fill: #16213e; stroke: #444; }
.node.leaf-child circle { fill: #2d1b4e; stroke: #7c5cbf; stroke-dasharray: 3,2; }
.node.collapsed circle { fill: #e94560; stroke: #ff6b6b; }
.node.found circle { fill: #f5a623 !important; stroke: #fff !important; }
.node.ancestor circle { fill: #27ae60 !important; stroke: #2ecc71 !important; }
.node text { font-size: 11px; fill: #ccc; pointer-events: none; }
.node text.name { font-weight: 600; fill: #eee; }
.node.leaf-child text.name { fill: #b39ddb; }
.node text.perhe-num { font-size: 9px; fill: #4a9fd4; }
.node.leaf-child text.perhe-num { fill: #7c5cbf; }
#info-panel {
  position: fixed; right: 0; top: 46px; bottom: 0; width: 280px;
  background: #16213e; border-left: 1px solid #0f3460;
  padding: 16px; overflow-y: auto;
  transform: translateX(100%); transition: transform 0.3s; z-index: 50;
}
#info-panel.open { transform: translateX(0); }
#info-panel h2 { font-size: 1rem; color: #e94560; margin-bottom: 10px; padding-right: 24px; line-height: 1.4; }
.info-row { margin-bottom: 8px; }
.info-label { font-size: 0.7rem; color: #888; text-transform: uppercase; letter-spacing: 0.05em; }
.info-value { font-size: 0.88rem; color: #eee; }
#close-panel { position: absolute; top: 12px; right: 12px;
  background: none; border: none; color: #888; cursor: pointer; font-size: 1.1rem; }
#close-panel:hover { color: #fff; }
#search-results {
  position: fixed; left: 8px; right: 8px;
  background: #16213e; border: 1px solid #0f3460;
  border-radius: 0 0 8px 8px; max-height: 55vh;
  overflow-y: auto; overflow-x: hidden;
  z-index: 200; display: none;
  box-shadow: 0 4px 16px rgba(0,0,0,0.5);
}
.search-item { padding: 8px 14px; cursor: pointer; font-size: 0.85rem; border-bottom: 1px solid #1a1a2e; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.search-item:hover { background: #0f3460; }
.search-item .year { color: #888; font-size: 0.75rem; margin-left: 6px; }
.search-item .tag { font-size: 0.7rem; color: #4a9fd4; margin-left: 6px; background: #0f3460; padding: 1px 5px; border-radius: 8px; }
.search-item.leaf-match .tag { color: #b39ddb; background: #2d1b4e; }
#no-results { padding: 10px 14px; color: #888; font-size: 0.85rem; }
#legend {
  position: fixed; bottom: 12px; left: 12px;
  background: #16213e; border: 1px solid #0f3460;
  border-radius: 8px; padding: 10px 14px; font-size: 0.75rem; z-index: 50;
}
.legend-item { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
.legend-dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid; flex-shrink: 0; }
#instructions {
  position: fixed; bottom: 12px; right: 12px;
  background: #16213e; border: 1px solid #0f3460;
  border-radius: 8px; padding: 10px 14px; font-size: 0.73rem; color: #888; z-index: 50;
  max-width: 180px; line-height: 1.7;
}
@media (max-width: 900px), (pointer: coarse) {
  #header { padding: 10px 10px; gap: 8px; }
  #header h1 { display: none; }
  .badge { display: none; }
  #search { font-size: 3rem; padding: 20px 24px; border-radius: 36px; }
  #btn-reset { font-size: 2rem; padding: 18px 24px; }
  #legend { display: none; }
  #instructions { display: none; }
  #info-panel { width: 100%; border-left: none; border-top: 1px solid #0f3460; top: auto; bottom: 0; height: 50vh; transform: translateY(100%); }
  #info-panel.open { transform: translateY(0); }
  .search-item { padding: 24px 24px; font-size: 2rem; }
  .search-item .year { font-size: 1.5rem; }
  .search-item .tag { font-size: 1.3rem; padding: 4px 12px; }
  #no-results { padding: 24px; font-size: 1.8rem; }
}
</style>

const svg = d3.select("#tree-svg");
const zoomLayer = svg.select("#zoom-layer");
const linksLayer = zoomLayer.select("#links-layer");
const nodesLayer = zoomLayer.select("#nodes-layer");

const root = d3.hierarchy(RAW_DATA);

// Build full search index BEFORE collapsing
const allNodes = root.descendants();
console.log("Total nodes:", allNodes.length);

// Collapse beyond depth 2
allNodes.forEach(d => {
  if (d.depth >= 2 && d.children) { d._children = d.children; d.children = null; }
});

const treeLayout = d3.tree().nodeSize([22, 230]).separation((a, b) => a.parent === b.parent ? 1 : 1.2);
let nodeUid = 0;

const zoom = d3.zoom().scaleExtent([0.04, 3])
  .on("zoom", event => zoomLayer.attr("transform", event.transform));
svg.call(zoom);
// Initial view is set after first render (fitView)

function diagonal(d) {
  const sx = d.source.y, sy = d.source.x, tx = d.target.y, ty = d.target.x, mx = (sx + tx) / 2;
  return "M" + sx + "," + sy + " C" + mx + "," + sy + " " + mx + "," + ty + " " + tx + "," + ty;
}

function nodeClass(d) {
  let c = "node";
  if (d.data.is_leaf_child) return c + " leaf-child";
  if (d._children) c += " collapsed";
  else if (d.children) c += " has-children";
  else c += " leaf";
  return c;
}

function shortName(name) {
  if (!name) return "?";
  const p = name.split(" ");
  return p.length <= 3 ? name : p[0] + " " + p[p.length - 1];
}

function yearLabel(d) {
  const b = d.data.born, e = d.data.died;
  if (b && e) return b + "\u2013" + e;
  if (b) return "s. " + b;
  return "";
}

function idLabel(d) {
  if (d.data.is_leaf_child) return "";
  return "P" + d.data.id;
}

function linkClass(d) {
  return "link" + (d.target.data.is_leaf_child ? " leaf-link" : "");
}

function update(source) {
  treeLayout(root);
  const nodes = root.descendants(), links = root.links();
  const srcPt = { x: source.x0 !== undefined ? source.x0 : source.x,
                  y: source.y0 !== undefined ? source.y0 : source.y };

  // Links
  const linkSel = linksLayer.selectAll("path.link")
    .data(links, d => (typeof d.target.data.id === "string" ? d.target.data.id : d.target.data.id));
  const linkEnter = linkSel.enter().append("path")
    .attr("class", linkClass)
    .attr("d", () => diagonal({ source: srcPt, target: srcPt }));
  linkSel.merge(linkEnter).transition().duration(400)
    .attr("class", linkClass)
    .attr("d", diagonal);
  linkSel.exit().transition().duration(300)
    .attr("d", () => diagonal({ source: { x: source.x, y: source.y }, target: { x: source.x, y: source.y } }))
    .remove();

  // Nodes
  const nodeSel = nodesLayer.selectAll("g.node")
    .data(nodes, d => d.uid || (d.uid = ++nodeUid));
  const nodeEnter = nodeSel.enter().append("g")
    .attr("class", nodeClass)
    .attr("transform", "translate(" + srcPt.y + "," + srcPt.x + ")")
    .on("click", (event, d) => {
      event.stopPropagation();
      if (!d.data.is_leaf_child) { toggle(d); update(d); }
      else showPanel(d);
    })
    .on("contextmenu", (event, d) => { event.preventDefault(); showPanel(d); });

  nodeEnter.append("circle").attr("r", 5);

  nodeEnter.append("text").attr("class", "name").attr("dy", "-0.15em")
    .attr("x", d => (d.children || d._children) ? -10 : 10)
    .attr("text-anchor", d => (d.children || d._children) ? "end" : "start")
    .text(d => shortName(d.data.name));

  nodeEnter.append("text").attr("class", "years").attr("dy", "1.0em")
    .attr("x", d => (d.children || d._children) ? -10 : 10)
    .attr("text-anchor", d => (d.children || d._children) ? "end" : "start")
    .attr("font-size", "9px").attr("fill", "#777")
    .text(yearLabel);

  nodeEnter.append("text").attr("class", "perhe-num")
    .attr("x", 0)
    .attr("dy", "-1.1em")
    .attr("text-anchor", "middle")
    .text(idLabel);

  const merged = nodeSel.merge(nodeEnter);
  merged.transition().duration(400)
    .attr("transform", d => "translate(" + d.y + "," + d.x + ")")
    .attr("class", nodeClass);

  merged.select("text.name")
    .attr("x", d => (d.children || d._children) ? -10 : 10)
    .attr("text-anchor", d => (d.children || d._children) ? "end" : "start");
  merged.select("text.years")
    .attr("x", d => (d.children || d._children) ? -10 : 10)
    .attr("text-anchor", d => (d.children || d._children) ? "end" : "start");
  // perhe-num stays centered above circle — no dynamic repositioning needed

  nodeSel.exit().transition().duration(300)
    .attr("transform", "translate(" + source.y + "," + source.x + ")")
    .style("opacity", 0).remove();

  nodes.forEach(d => { d.x0 = d.x; d.y0 = d.y; });
}

function toggle(d) {
  if (d.children) { d._children = d.children; d.children = null; }
  else { d.children = d._children; d._children = null; }
}

root.x0 = 0; root.y0 = 0;
update(root);

function fitView() {
  const svgEl = document.getElementById("tree-svg");
  const W = svgEl.clientWidth || window.innerWidth;
  const H = svgEl.clientHeight || (window.innerHeight - 50);
  if (W === 0 || H === 0) { requestAnimationFrame(fitView); return; }
  const visibleNodes = root.descendants();
  if (!visibleNodes.length) return;
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  visibleNodes.forEach(d => {
    if (d.x !== undefined) {
      x0 = Math.min(x0, d.x); x1 = Math.max(x1, d.x);
      y0 = Math.min(y0, d.y); y1 = Math.max(y1, d.y);
    }
  });
  const pad = 80;
  const scale = Math.min(W / (y1 - y0 + pad * 2), H / (x1 - x0 + pad * 2), 1.4);
  const tx = W / 2 - (y0 + (y1 - y0) / 2) * scale;
  const ty = H / 2 - (x0 + (x1 - x0) / 2) * scale;
  svg.call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));
}
// Wait for DOM to render before fitting
requestAnimationFrame(fitView);

// ── Info panel ────────────────────────────────────────────────────────────────
function showPanel(d) {
  const isLeaf = d.data.is_leaf_child;
  document.getElementById("info-name").textContent =
    d.data.name + (isLeaf ? "" : " (P" + d.data.id + ")");
  const rows = [
    ["Syntynyt", d.data.born || "\u2014"],
    ["Kuollut", d.data.died || "\u2014"],
  ];
  if (!isLeaf) {
    const kidCount = (d.children ? d.children.length : 0) + (d._children ? d._children.length : 0);
    const spouse = d.data.spouse ? d.data.spouse.replace(/^Pielisjärvi\s+/, "") : "\u2014";
    rows.unshift(["Perhe #", d.data.id]);
    rows.push(["Sukupolvi", d.data.generation ? d.data.generation + ". polvi" : "\u2014"]);
    rows.push(["Puoliso", spouse]);
    rows.push(["Lapsiperheitä / lapsia", kidCount]);
  } else {
    rows.unshift(["Ei omaa perhettä", "sukupuu päättyy tähän"]);
  }
  document.getElementById("info-content").innerHTML = rows.map(([l, v]) =>
    '<div class="info-row"><div class="info-label">' + l + '</div><div class="info-value">' + v + '</div></div>'
  ).join("");
  document.getElementById("info-panel").classList.add("open");
}
document.getElementById("close-panel").onclick = () =>
  document.getElementById("info-panel").classList.remove("open");

// ── Search ────────────────────────────────────────────────────────────────────
const searchInput = document.getElementById("search");
const searchResults = document.getElementById("search-results");

function positionResults() {
  const rect = document.getElementById("header").getBoundingClientRect();
  searchResults.style.top = rect.bottom + "px";
}

searchInput.addEventListener("input", () => {
  const q = searchInput.value.trim().toLowerCase();
  if (q.length < 2) { searchResults.style.display = "none"; return; }

  const matches = allNodes.filter(d => d.data.name && d.data.name.toLowerCase().includes(q));
  if (matches.length === 0) {
    searchResults.innerHTML = "<div id='no-results'>Ei tuloksia</div>";
    positionResults();
    searchResults.style.display = "block";
    return;
  }

  let html = matches.slice(0, 20).map((d, idx) => {
    const isLeaf = d.data.is_leaf_child;
    const yrs = (d.data.born || "") + (d.data.born && d.data.died ? "\u2013" : "") + (d.data.died || "");
    const tag = isLeaf
      ? '<span class="tag" style="color:#b39ddb;background:#2d1b4e">P' + (d.parent ? d.parent.data.id : "?") + '</span>'
      : '<span class="tag">P' + d.data.id + '</span>';
    return '<div class="search-item' + (isLeaf ? " leaf-match" : "") + '" data-idx="' + idx + '">' +
      d.data.name + (yrs ? '<span class="year">' + yrs + '</span>' : '') + tag + '</div>';
  }).join("");
  if (matches.length > 20) html += "<div id='no-results'>...ja " + (matches.length - 20) + " muuta</div>";

  // Store reference to visible matches for click handler
  const visibleMatches = matches.slice(0, 20);
  searchResults.innerHTML = html;
  searchResults.querySelectorAll(".search-item").forEach(el => {
    el.addEventListener("click", () => {
      const idx2 = +el.dataset.idx;
      const target = visibleMatches[idx2];
      searchResults.style.display = "none";
      searchInput.value = "";
      jumpTo(target);
    });
  });
  positionResults();
  searchResults.style.display = "block";
});

searchInput.addEventListener("focus", () => {
  if (searchInput.value.trim().length >= 2) {
    positionResults();
    searchResults.style.display = "block";
  }
});

document.addEventListener("click", e => {
  if (!searchResults.contains(e.target) && e.target !== searchInput) {
    searchResults.style.display = "none";
  }
});

window.addEventListener("resize", positionResults);

// ── Jump to node ──────────────────────────────────────────────────────────────
function jumpTo(d) {
  // Clear previous highlights
  nodesLayer.selectAll("g.node").classed("found", false).classed("ancestor", false);

  // Expand all ancestors to make target visible
  const ancestors = [];
  let cur = d.parent;
  while (cur) { ancestors.push(cur); cur = cur.parent; }
  ancestors.forEach(a => {
    if (a._children) { a.children = a._children; a._children = null; }
  });
  update(root);

  // Re-find node after update (d.x/d.y are set by treeLayout inside update)
  treeLayout(root);

  // Highlight
  nodesLayer.selectAll("g.node")
    .classed("found", n => n === d)
    .classed("ancestor", n => ancestors.includes(n));

  // Pan to target
  if (d.x !== undefined && d.y !== undefined) {
    const svgEl = document.getElementById("tree-svg");
    const W = svgEl.clientWidth || window.innerWidth;
    const H = svgEl.clientHeight || (window.innerHeight - 50);
    const scale = 0.75;
    svg.transition().duration(700).call(
      zoom.transform,
      d3.zoomIdentity.translate(W / 2 - d.y * scale, H / 2 - d.x * scale).scale(scale)
    );
  }
}

// ── Reset ─────────────────────────────────────────────────────────────────────
document.getElementById("btn-reset").addEventListener("click", () => {
  nodesLayer.selectAll("g.node").classed("found", false).classed("ancestor", false);
  searchInput.value = "";
  searchResults.style.display = "none";
  allNodes.forEach(d => {
    if (d.depth >= 2 && d.children) { d._children = d.children; d.children = null; }
  });
  update(root);
  requestAnimationFrame(fitView);
});

</script>
